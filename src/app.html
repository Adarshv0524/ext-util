<!httptype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>imgapi — Image Microservice</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-zinc-300 text-zinc-900 font-sans antialiased min-h-screen relative">
		<!-- SVG Noise Overlay -->
		<svg class="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-[0.06] mix-blend-multiply" xmlns="http://www.w3.org/2000/svg">
			<filter id="noiseFilter">
				<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
			</filter>
			<rect width="100%" height="100%" filter="url(#noiseFilter)" />
		</svg>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
